server:
  port: ${PORT:8080}
spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yubaba}
    username: ${DB_USER:yubaba}
    password: ${DB_PASSWORD:yubaba-local}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jpa:
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
app:
  jwt-secret: ${JWT_SECRET:local-demo-only-secret-change-before-deployment-123456}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:Yubaba-demo-2026}
  demo: ${DEMO_DATA:false}
